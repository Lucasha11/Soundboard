    .glyph { position: absolute; left: 50%; top: 46%; z-index: 3; width: 46px; height: 46px;

    .lab { position: absolute; left: 10px; right: 10px; bottom: 9px; z-index: 3; }
    .nm { display: block; font-size: 11px; letter-spacing: -0.005em;

    .who { display: block; margin-top: 2px; font-size: 10px; color: #9aa0a8; }
    .tagl { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex;

    .dur { position: absolute; top: 8px; left: 8px; z-index: 3; padding: 2px 5px;

<script data-dc-script>
class Component extends DCLogic {
  ctx() {
    if (!this._ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this._ctx = AC ? new AC() : null;
    }
    return this._ctx;
  }
  blip(freq, kind, dur) {
    const ctx = this.ctx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = kind;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(70, freq * 0.55), t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.2, t + 0.014);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }
  fire(i, s) {
    if (s.locked) {
      this.setState({ on: -1, nudge: i });
      clearTimeout(this._n);
      this._n = setTimeout(() => this.setState({ nudge: -1 }), 2200);
      return;
    }
    this.blip(s.f, s.k, s.d);
    this.setState({ on: i, nudge: -1, name: s.name, who: s.who });
