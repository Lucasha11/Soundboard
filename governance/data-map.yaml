# Every persisted field and analytics event. DG-CLASS-03, DG-RET-01, DG-LOG-05.
# A field absent from this file must not be persisted. An event absent from this
# file is dropped by the pipeline. Untagged fields are treated as C2 (DG-CLASS-02).
version: 2.0

# v2.0 periods. See DATA_GOVERNANCE.md Section 7.
retention_policies:
  raw_engagement_events:          { days: 760,   basis: rolling }
  aggregated_engagement_counters: { days: null,  basis: indefinite_non_personal }
  account_record:                 { days: 30,    basis: after_account_deletion }
  session_and_device_identifiers: { days: 760,   basis: rolling }
  ip_address:                     { days: 30,    basis: rolling }
  advertising_identifier:         { days: 760,   basis: rolling_or_att_withdrawal }
  payment_transaction_record:     { days: 2555,  basis: legal_retention }
  audio_asset:                    { days: 0,     basis: on_removal_or_claim }
  submission_record:              { days: 1095,  basis: after_asset_removal }
  moderation_and_takedown_record: { days: 1095,  basis: safe_harbor_record }
  ranking_audit_record:           { days: 730,   basis: rolling }
  application_logs:               { days: 90,    basis: rolling }
  # On-device personal lane. Media the user imported for their own board never
  # leaves the device, so retention is user-controlled rather than time-based.
  # P10 still requires a declared policy, and deletion is immediate and hard.
  device_local_user_content:      { days: 0,     basis: on_user_delete }
  device_local_board_layout:      { days: 0,     basis: on_user_delete }

# ---- Persisted fields ----------------------------------------------------
# store: logical table or collection
# class: C0 | C1 | C2 | C3 | C4
fields:
  # ---- Personal lane, on device only. Nothing here is transmitted. ----------
  - store: sound
    field: id
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: false
    exportable: true
    deletable: true
  - store: sound
    field: title
    class: C2
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: true
    exportable: true
    deletable: true
  - store: sound
    field: duration_ms
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: false
    exportable: true
    deletable: true
  - store: sound
    field: created_at
    class: C2
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: true
    exportable: true
    deletable: true
  # Blob references. The payloads are C3 and C4; a content digest is neither.
  - store: sound
    field: audio_blob_id
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: false
    exportable: true
    deletable: true
  - store: sound
    field: animation_blob_id
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: false
    exportable: true
    deletable: true
  - store: sound
    field: poster_blob_id
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: false
    exportable: true
    deletable: true
  # v2.0 no longer classes a voice recording as C3, so C4 would be defensible
  # here. Kept at C3 deliberately: the blob is encrypted and never leaves the
  # device, so the stricter class costs nothing. See BACKEND_PLAN.md Section 1.
  - store: media_blob
    field: audio_payload
    class: C3
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: true
    exportable: true
    deletable: true
  - store: media_blob
    field: visual_payload
    class: C4
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: true
    exportable: true
    deletable: true
  - store: media_blob
    field: sha256
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: false
    exportable: false
    deletable: true
  - store: media_blob
    field: refcount
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: device_local_user_content
    encrypted_at_rest: false
    exportable: false
    deletable: true
  - store: board
    field: name
    class: C2
    purpose_ids: [P-SERVE]
    retention_ref: device_local_board_layout
    encrypted_at_rest: true
    exportable: true
    deletable: true
  - store: board_tile
    field: board_id
    class: C2
    purpose_ids: [P-SERVE]
    retention_ref: device_local_board_layout
    encrypted_at_rest: true
    exportable: true
    deletable: true
  - store: board_tile
    field: sound_id
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: device_local_board_layout
    encrypted_at_rest: false
    exportable: true
    deletable: true
  - store: board_tile
    field: position
    class: C2
    purpose_ids: [P-SERVE]
    retention_ref: device_local_board_layout
    encrypted_at_rest: true
    exportable: true
    deletable: true
  # import_job deliberately has no source_filename field. DG-LOG-01 bars upload
  # filenames from logs and no shipped feature consumes one (P12).
  - store: import_job
    field: id
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: application_logs
    encrypted_at_rest: false
    exportable: false
    deletable: true
  - store: import_job
    field: failure_code
    class: C1
    purpose_ids: [P-SERVE]
    retention_ref: application_logs
    encrypted_at_rest: false
    exportable: false
    deletable: true

